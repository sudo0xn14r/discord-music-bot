spring:
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

server: # REST and WS server
  port: 2333
  address: 127.0.0.1
  http2:
    enabled: false

lavalink:
  plugins:
    # youtube-source replaces Lavalink's deprecated built-in YouTube source.
    # Keep sources.youtube false below or the two sources fight over the same links.
    # 1.18.2 is the newest release, and YouTube now rejects its TV client with
    # "The page needs to be reloaded." This snapshot is the current build, which
    # uses the TV client YouTube still accepts when OAuth is enabled.
    - dependency: "dev.lavalink.youtube:youtube-plugin:2be8e542d3f6f178e048dca565892684c2e40177"
      repository: "https://maven.lavalink.dev/snapshots"
      snapshot: false
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.github.Lochis.soundy:plugin:1.1.0"
      repository: "https://jitpack.io"
  server:
    password: "changeme"
    sources:
      # Built-in YouTube source is deprecated. The youtube plugin above plays YouTube.
      youtube: false
      bandcamp: true
      # Lavalink's built-in SoundCloud source cannot read current SoundCloud streams.
      # The soundy plugin above provides SoundCloud links and scsearch without a login.
      soundcloud: false
      twitch: true
      vimeo: true
      nico: false
      http: true
      local: true
    filters:
      volume: true
      equalizer: true
      karaoke: false
      timescale: true
      tremolo: false
      vibrato: false
      distortion: false
      rotation: false
      channelMix: false
      lowPass: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: MEDIUM
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    # The plugin still reads this limit. 50 matches the bot queue cap.
    youtubePlaylistLoadLimit: 50
    playerUpdateInterval: 5
    # Built-in YouTube search stays off. The plugin's allowSearch enables ytsearch: instead.
    youtubeSearchEnabled: false
    soundcloudSearchEnabled: true
    soundcloudFilterOutPreviewTracks: true
    gc-warnings: true
    timeouts:
      connectTimeoutMs: 10000
      connectionRequestTimeoutMs: 10000
      socketTimeoutMs: 15000

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # The plugin cannot read the current YouTube player script locally.
    # This public cipher turns the scrambled stream address into a playable URL.
    remoteCipher:
      url: "https://cipher.kikkia.dev/"
    clients:
      - MUSIC
      # TV is the client that uses the YouTube sign-in. Without it, OAuth is on and unused.
      - TV
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    # OAuth and a poToken are optional. Leave OAuth off unless playback starts
    # failing with a "sign in to confirm you're not a bot" error. Use a burner
    # account if you turn OAuth on. Uncomment one of these, not both.
    oauth:
      enabled: false
      # refreshToken: "${YOUTUBE_REFRESH_TOKEN:}"
    # pot:
    #   token: "${YOUTUBE_POTOKEN:}"
    #   visitorData: "${YOUTUBE_VISITOR_DATA:}"
  soundy:
    enabled: true
  lavasrc:
    providers:
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      deezer: false
      youtube: false
      ytdlp: false
    lyrics-sources:
      spotify: false
      deezer: false
      youtube: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: "US"
      playlistLoadLimit: 1
      albumLoadLimit: 1

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: true
    includeClientInfo: false
    includeHeaders: false
    includeQueryString: false
    includePayload: false
    maxPayloadLength: 1000
    beforeRequest: false
  logback:
    rollingpolicy:
      max-file-size: 25MB
      max-history: 7
