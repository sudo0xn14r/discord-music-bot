spring:
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

server: # REST and WS server
  port: 2333
  address: 127.0.0.1
  http2:
    enabled: false

lavalink:
  plugins:
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.github.Lochis.soundy:plugin:1.1.0"
      repository: "https://jitpack.io"
  server:
    password: "changeme"
    sources:
      youtube: false
      bandcamp: true
      # Lavalink's built-in SoundCloud source cannot read current SoundCloud streams.
      # The soundy plugin above provides SoundCloud links and scsearch without a login.
      soundcloud: false
      twitch: true
      vimeo: true
      nico: false
      http: true
      local: true
    filters:
      volume: true
      equalizer: true
      karaoke: false
      timescale: true
      tremolo: false
      vibrato: false
      distortion: false
      rotation: false
      channelMix: false
      lowPass: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: MEDIUM
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: false
    soundcloudSearchEnabled: true
    soundcloudFilterOutPreviewTracks: true
    gc-warnings: true
    timeouts:
      connectTimeoutMs: 10000
      connectionRequestTimeoutMs: 10000
      socketTimeoutMs: 15000

plugins:
  soundy:
    enabled: true
  lavasrc:
    providers:
      - "scsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      deezer: false
      youtube: false
      ytdlp: false
    lyrics-sources:
      spotify: false
      deezer: false
      youtube: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: "US"
      playlistLoadLimit: 1
      albumLoadLimit: 1

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: true
    includeClientInfo: false
    includeHeaders: false
    includeQueryString: false
    includePayload: false
    maxPayloadLength: 1000
    beforeRequest: false
  logback:
    rollingpolicy:
      max-file-size: 25MB
      max-history: 7
